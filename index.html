<head>

<title>نوبینو — نوبت‌دهی هوشمند سالن</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Yekan+Bakh:wght@400;500;600;700;800&display=swap');
:root{--bg:#f5f7fb;--surface:#fff;--ink:#0b1220;--muted:#64748b;--line:#e7ebf2;--brand:#0f766e;--brand2:#115e59;--soft:#e8f5f3;--gold:#c89b3c;--danger:#c2413a;--shadow:0 16px 50px rgba(15,23,42,.09);--r:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn","Yekan Bakh",sans-serif;line-height:1.7}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.container{width:min(1160px,calc(100% - 32px));margin:auto}
.topbar{background:#0b1220;color:#dbe5f0;font-size:12px}.topbar .container{height:34px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.5px}.mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#d8b36a,#9d7223);display:grid;place-items:center;color:#0b1220;font-weight:900;box-shadow:0 7px 18px rgba(200,155,60,.2)}
.nav{height:76px;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.nav .container{height:100%;display:flex;align-items:center;justify-content:space-between}.navlinks{display:flex;gap:28px;color:#475569;font-size:14px}.navlinks a{color:inherit;text-decoration:none}.actions{display:flex;gap:10px;align-items:center}.btn{border:0;border-radius:12px;padding:11px 17px;font-weight:700;transition:.18s transform,.18s box-shadow,.18s background}.btn:hover{transform:translateY(-1px)}.btn.primary{background:var(--brand);color:white;box-shadow:0 8px 22px rgba(15,118,110,.18)}.btn.dark{background:#0b1220;color:white}.btn.ghost{background:white;border:1px solid var(--line);color:#334155}.btn.gold{background:var(--gold);color:#0b1220}.iconbtn{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:12px;display:grid;place-items:center}
.hero{padding:76px 0 58px;background:radial-gradient(circle at 85% 18%,rgba(15,118,110,.13),transparent 28%),linear-gradient(180deg,#fff 0%,#f7faf9 100%)}.heroGrid{display:grid;grid-template-columns:1.08fr .92fr;gap:64px;align-items:center}.eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--brand);background:var(--soft);padding:7px 11px;border-radius:999px;font-size:12px;font-weight:800}.hero h1{font-size:clamp(36px,5vw,62px);line-height:1.13;letter-spacing:-2.5px;margin:18px 0}.hero h1 span{color:var(--brand)}.hero p{font-size:17px;color:#526174;max-width:650px;margin:0 0 28px}.heroBtns{display:flex;gap:12px;flex-wrap:wrap}.heroMeta{display:flex;gap:24px;margin-top:30px;color:#64748b;font-size:12px}.heroMeta strong{display:block;color:#0f172a;font-size:16px}.bookingPreview{background:#0b1220;border-radius:28px;padding:18px;box-shadow:0 28px 80px rgba(11,18,32,.25);transform:rotate(-1deg)}.previewTop{color:white;display:flex;justify-content:space-between;align-items:center;padding:8px 8px 14px}.previewCard{background:white;border-radius:20px;padding:18px}.salonHead{display:flex;gap:12px;align-items:center}.avatar{width:48px;height:48px;border-radius:15px;background:#e8f5f3;display:grid;place-items:center;color:var(--brand);font-weight:800}.mini{font-size:11px;color:var(--muted)}.previewLine{height:1px;background:var(--line);margin:16px 0}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center;font-size:12px}.slot.active{background:var(--brand);border-color:var(--brand);color:white}
.section{padding:80px 0}.sectionHead{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:30px}.sectionHead h2{font-size:32px;letter-spacing:-1px;margin:0}.sectionHead p{color:var(--muted);margin:6px 0 0;max-width:620px}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.feature{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 8px 26px rgba(15,23,42,.04)}.featureIcon{width:44px;height:44px;border-radius:13px;background:var(--soft);color:var(--brand);display:grid;place-items:center;margin-bottom:16px}.feature h3{margin:0 0 6px;font-size:17px}.feature p{color:var(--muted);font-size:13px;margin:0}
.demo{background:#0b1220;color:white;padding:70px 0}.demoGrid{display:grid;grid-template-columns:.85fr 1.15fr;gap:40px;align-items:center}.demo h2{font-size:34px;margin:0 0 12px}.demo p{color:#aebbd0}.trial{display:flex;align-items:center;gap:10px;color:#dbe5f0;font-size:13px;margin:20px 0}.dot{width:9px;height:9px;background:#7dd3c7;border-radius:50%;box-shadow:0 0 0 5px rgba(125,211,199,.1)}.pricing{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.price{background:#111a2b;border:1px solid #253147;border-radius:18px;padding:20px}.price strong{font-size:28px}.price span{color:#9caabd;font-size:12px}.price ul{padding:0 18px;margin:18px 0;color:#cbd5e1;font-size:12px}
.footer{padding:30px 0;background:#080e19;color:#8795a8;font-size:12px}.footer .container{display:flex;justify-content:space-between}
/* app */
.app{min-height:100vh;background:#f3f6f8}.appbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:15}.appbody{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 70px)}.sidebar{background:#0b1220;color:#b9c4d3;padding:20px 14px}.sideBrand{color:#fff;margin:0 8px 24px}.sideItem{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:10px;margin:3px 0;font-size:13px;cursor:pointer}.sideItem.active,.sideItem:hover{background:#172235;color:white}.main{padding:28px;max-width:1500px;width:100%;margin:auto}.pageTitle{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.pageTitle h1{margin:0;font-size:27px}.pageTitle p{margin:3px 0;color:var(--muted);font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}.stat .label{font-size:11px;color:var(--muted)}.stat .value{font-size:25px;font-weight:800;margin:4px 0}.stat .trend{font-size:11px;color:var(--brand)}.dashboardGrid{display:grid;grid-template-columns:1.4fr .8fr;gap:16px;margin-top:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.panelHead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.panelHead h3{margin:0;font-size:15px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:right;padding:13px 16px;border-bottom:1px solid #f0f2f5;font-size:12px}.table th{color:#7b8797;font-weight:600;background:#fbfcfd}.status{padding:4px 8px;border-radius:999px;background:#e9f7f4;color:#0f766e;font-size:10px}.status.warn{background:#fff6df;color:#9a6b12}.profileRow{display:flex;align-items:center;gap:10px}.person{width:36px;height:36px;border-radius:11px;background:#eef2ff;display:grid;place-items:center;font-size:12px;font-weight:800;color:#4f46e5}.calendar{padding:18px}.calHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{border:1px solid var(--line);border-radius:12px;padding:9px 6px;min-height:92px}.day b{font-size:11px}.appt{margin-top:7px;padding:6px;border-radius:8px;background:#e8f5f3;color:#0f766e;font-size:9px}.appt.dark{background:#eef2ff;color:#4338ca}
/* booking modal */
.overlay{position:fixed;inset:0;background:rgba(5,10,18,.62);backdrop-filter:blur(7px);z-index:100;display:grid;place-items:center;padding:18px}.modal{width:min(780px,100%);max-height:92vh;overflow:auto;background:white;border-radius:24px;box-shadow:0 30px 100px rgba(0,0,0,.3)}.modalHead{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modalHead h2{margin:0;font-size:19px}.modalBody{padding:22px}.steps{display:flex;gap:6px;margin-bottom:22px}.step{height:5px;flex:1;background:#e8edf2;border-radius:99px}.step.on{background:var(--brand)}.choiceGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{border:1px solid var(--line);border-radius:15px;padding:14px;background:#fff;text-align:right;transition:.15s}.choice:hover{border-color:#9bc9c4}.choice.selected{border:2px solid var(--brand);background:#f2faf9}.choice .title{font-weight:800;font-size:13px}.choice .desc{font-size:11px;color:var(--muted)}.people{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.personCard{display:flex;gap:11px;align-items:center}.personImg{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,#dceeea,#f1e5cc);display:grid;place-items:center;font-weight:800;color:#475569}.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.time{padding:11px;border:1px solid var(--line);border-radius:11px;text-align:center;font-size:12px}.time.selected{background:var(--brand);color:#fff;border-color:var(--brand)}.form{display:grid;gap:12px}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:5px}.field input{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;outline:none}.field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.08)}.modalFoot{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.notice{background:#f7f8fa;border-radius:12px;padding:12px;font-size:11px;color:#657386}.success{padding:34px;text-align:center}.successMark{width:66px;height:66px;border-radius:22px;background:var(--soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 14px;font-size:28px}.qrBox{display:grid;place-items:center;padding:20px}.qr{width:150px;height:150px;border:10px solid #0b1220;background:repeating-conic-gradient(#0b1220 0 25%,#fff 0 50%) 0/20px 20px}
.toast{position:fixed;left:18px;bottom:18px;background:#0b1220;color:white;padding:12px 16px;border-radius:12px;z-index:200;box-shadow:var(--shadow);font-size:12px;animation:rise .25s ease}@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:900px){.heroGrid,.demoGrid,.dashboardGrid{grid-template-columns:1fr}.features{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr}.appbody{grid-template-columns:1fr}.sidebar{display:none}.main{padding:18px}.navlinks{display:none}.hero{padding-top:48px}.pricing{grid-template-columns:1fr}.week{overflow:auto;grid-template-columns:repeat(7,100px)} }
@media(max-width:560px){.container{width:min(100% - 22px,1160px)}.features,.cards,.choiceGrid,.people{grid-template-columns:1fr}.hero h1{font-size:37px}.heroMeta{gap:14px}.nav{height:64px}.nav .brand{font-size:16px}.actions .ghost{display:none}.modalBody{padding:16px}.times{grid-template-columns:repeat(3,1fr)}.footer .container{display:block}.footer .container div+div{margin-top:8px}}
</style>

<body>
<div id="root"></div>
<div id="overlay" class="overlay hidden"></div>
<script>
const state={screen:'landing',bookingStep:1,service:null,pro:null,time:null,auth:false};
const services=[['کوتاهی و استایل','۴۵ دقیقه','۲۸۰,۰۰۰ تومان'],['اصلاح کامل سر و صورت','۶۰ دقیقه','۳۹۰,۰۰۰ تومان'],['رنگ و مش','۱۲۰ دقیقه','۸۹۰,۰۰۰ تومان'],['کراتینه و احیا','۱۸۰ دقیقه','۱,۴۵۰,۰۰۰ تومان']];
const pros=[['سمیرا نوروزی','متخصص خدمات ناخن و ژل'],['نگار احمدی','متخصص رنگ، مش و احیای مو'],['مهسا کریمی','متخصص کوتاهی و استایل']];
const times=['09:30','10:15','11:00','12:30','14:00','15:30','17:00','18:30'];
function icon(type){const paths={calendar:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M16 2v4M8 2v4M3 9h18"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 20c.5-3.2 2.6-5 6-5s5.5 1.8 6 5M16 11a3 3 0 1 0 0-6M16 15c2.8.2 4.5 1.8 5 5"/>',chart:'<path d="M4 19V5M4 19h17"/><path d="m7 15 4-5 3 3 5-7"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.8 1.8 0 0 0 .3 2l.1.1-1.7 1.7-.1-.1a1.8 1.8 0 0 0-2-.3 1.8 1.8 0 0 0-1 1.7v.2h-2.4v-.2a1.8 1.8 0 0 0-1-1.7 1.8 1.8 0 0 0-2 .3l-.1.1-1.7-1.7.1-.1a1.8 1.8 0 0 0 .3-2 1.8 1.8 0 0 0-1.7-1H6.3v-2.4h.2a1.8 1.8 0 0 0 1.7-1 1.8 1.8 0 0 0-.3-2l-.1-.1 1.7-1.7.1.1a1.8 1.8 0 0 0 2 .3 1.8 1.8 0 0 0 1-1.7v-.2H15v.2a1.8 1.8 0 0 0 1 1.7 1.8 1.8 0 0 0 2-.3l.1-.1 1.7 1.7-.1.1a1.8 1.8 0 0 0-.3 2 1.8 1.8 0 0 0 1.7 1h.2V14h-.2a1.8 1.8 0 0 0-1.7 1z"/>',bell:'<path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',qr:'<path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v2h-2zM14 18h6v2h-6z"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',check:'<path d="m5 12 4 4L19 6"/>'};return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths[type]||paths.calendar}</svg>`}
function render(){document.getElementById('root').innerHTML=state.screen==='landing'?landing():dashboard()}
function landing(){return `<div class="topbar"><div class="container"><span>نوبینو · نوبت‌دهی هوشمند برای سالن‌های حرفه‌ای</span><span>۱۴ روز استفاده آزمایشی رایگان</span></div></div><nav class="nav"><div class="container"><div class="brand"><div class="mark">ن</div>نوبینو</div><div class="navlinks"><a href="#features">امکانات</a><a href="#workflow">نحوه کار</a><a href="#pricing">اشتراک</a></div><div class="actions"><button class="btn ghost" onclick="openAuth()">ورود سالن</button><button class="btn primary" onclick="openBooking()">رزرو نوبت</button></div></div></nav><header class="hero"><div class="container heroGrid"><div><span class="eyebrow">${icon('calendar')} رزرو بدون تماس تلفنی</span><h1>نوبت‌دهی سالن را از <span>تماس تلفنی</span> نجات بده.</h1><p>یک سیستم حرفه‌ای برای مدیریت نوبت، متخصص، خدمات و زمان‌های آزاد؛ مشتری خودش رزرو می‌کند و سالن فقط نتیجه را می‌بیند.</p><div class="heroBtns"><button class="btn primary" onclick="openBooking()">رزرو آزمایشی نوبت ${icon('arrow')}</button><button class="btn ghost" onclick="openAuth()">ورود به پنل سالن</button></div><div class="heroMeta"><div><strong>۱۴ روز</strong>دموی رایگان</div><div><strong>۲۴/۷</strong>دسترسی مشتری</div><div><strong>۰ تماس</strong>برای رزرو</div></div></div><div class="bookingPreview"><div class="previewTop"><span>صفحه رزرو سالن</span><span style="font-size:11px;color:#91a2b8">LIVE</span></div><div class="previewCard"><div class="salonHead"><div class="avatar">س</div><div><b>سالن زیبایی سمیرا</b><div class="mini">غرب تهران · امروز</div></div></div><div class="previewLine"></div><div class="mini" style="margin-bottom:8px">خدمت انتخاب‌شده</div><div style="font-weight:800;font-size:14px">کاشت و ترمیم ناخن · ۹۰ دقیقه</div><div class="previewLine"></div><div class="mini" style="margin-bottom:8px">اولین زمان‌های آزاد</div><div class="slots"><div class="slot">۱۰:۳۰</div><div class="slot active">۱۲:۰۰</div><div class="slot">۱۴:۳۰</div></div></div></div></div></header><section class="section" id="features"><div class="container"><div class="sectionHead"><div><h2>برای سالن، ساده. برای مشتری، سریع.</h2><p>تمام چیزهایی که یک سالن برای تبدیل نوبت‌دهی سنتی به یک تجربه دیجیتال لازم دارد، در یک سیستم یکپارچه.</p></div></div><div class="features"><div class="feature"><div class="featureIcon">${icon('calendar')}</div><h3>موتور زمان‌بندی هوشمند</h3><p>بر اساس مدت خدمت، متخصص، ساعات کاری و رزروهای قبلی، فقط زمان‌های واقعاً قابل رزرو نمایش داده می‌شوند.</p></div><div class="feature"><div class="featureIcon">${icon('users')}</div><h3>پروفایل متخصص‌ها</h3><p>مشتری می‌تواند متخصص دلخواهش را همراه عکس، نام و حوزه تخصص انتخاب کند.</p></div><div class="feature"><div class="featureIcon">${icon('qr')}</div><h3>QR اختصاصی سالن</h3><p>پس از تکمیل اطلاعات، لینک رزرو اختصاصی سالن ساخته می‌شود و QR آن را می‌توان چاپ و در سالن نصب کرد.</p></div></div></div></section><section class="demo" id="workflow"><div class="container demoGrid"><div><h2>۱۴ روز فرصت بده؛ سیستم خودش حرف می‌زند.</h2><p>آرایشگر با حساب اختصاصی وارد می‌شود، سالن را تنظیم می‌کند و بدون نیاز به تأیید دستی هر رزرو، سیستم شروع به کار می‌کند.</p><div class="trial"><span class="dot"></span> شروع آزمایشی بدون پرداخت · ۱۴ روز</div><button class="btn gold" onclick="openAuth()">شروع دوره آزمایشی</button></div><div id="pricing" class="pricing"><div class="price"><span>اشتراک ماهانه</span><strong>—</strong><ul><li>تقویم و رزرو آنلاین</li><li>مدیریت خدمات و متخصص‌ها</li><li>اعلان رزرو</li></ul></div><div class="price"><span>اشتراک شش‌ماهه</span><strong>—</strong><ul><li>همه امکانات اصلی</li><li>QR اختصاصی سالن</li><li>مدیریت حرفه‌ای نوبت‌ها</li></ul></div><div class="price"><span>اشتراک سالانه</span><strong>—</strong><ul><li>همه امکانات</li><li>مناسب سالن‌های فعال</li><li>قیمت‌گذاری بعداً تعیین می‌شود</li></ul></div></div></div></section><footer class="footer"><div class="container"><div>© ۱۴۰۵ نوبینو · نمونه اولیه محصول</div><div>حریم خصوصی · قوانین · پشتیبانی</div></div></footer>`}
function dashboard(){return `<div class="app"><header class="appbar"><div class="brand"><div class="mark">ن</div>نوبینو <span style="font-size:11px;color:#94a3b8;font-weight:500">پنل مدیریت سالن</span></div><div class="actions"><button class="iconbtn" onclick="toast('۳ اعلان جدید دارید')">${icon('bell')}</button><button class="btn ghost" onclick="state.screen='landing';render()">خروج</button></div></header><div class="appbody"><aside class="sidebar"><div class="sideBrand brand"><div class="mark">س</div>سالن سمیرا</div><div class="sideItem active">${icon('chart')} داشبورد</div><div class="sideItem">${icon('calendar')} تقویم نوبت‌ها</div><div class="sideItem">${icon('users')} مشتریان</div><div class="sideItem">${icon('settings')} خدمات و متخصص‌ها</div><div class="sideItem">${icon('qr')} صفحه رزرو و QR</div><div style="margin-top:30px;padding:14px;border:1px solid #26344a;border-radius:14px"><div style="font-size:11px;color:#9aa9bd">دوره آزمایشی</div><strong style="color:#fff">۱۴ روز باقی‌مانده</strong><div style="height:5px;background:#253147;border-radius:99px;margin-top:9px"><div style="width:72%;height:100%;background:#c89b3c;border-radius:99px"></div></div></div></aside><main class="main"><div class="pageTitle"><div><h1>سلام سمیرا، آماده‌ای؟</h1><p>نمای کلی عملکرد سالن و نوبت‌های امروز</p></div><button class="btn primary" onclick="openBooking()">${icon('calendar')} مشاهده صفحه رزرو</button></div><div class="cards"><div class="stat"><div class="label">نوبت‌های امروز</div><div class="value">۱۸</div><div class="trend">۴ نوبت جدید</div></div><div class="stat"><div class="label">مشتری جدید</div><div class="value">۷</div><div class="trend">+۲۳٪ نسبت به هفته قبل</div></div><div class="stat"><div class="label">ساعات پرشده</div><div class="value">۸۲٪</div><div class="trend">ظرفیت خوب</div></div><div class="stat"><div class="label">رزرو بدون تماس</div><div class="value">۹۴٪</div><div class="trend">هدف: ۱۰۰٪</div></div></div><div class="dashboardGrid"><section class="panel"><div class="panelHead"><h3>نوبت‌های امروز</h3><button class="btn ghost" style="padding:7px 10px;font-size:11px">تقویم کامل</button></div><table class="table"><thead><tr><th>زمان</th><th>مشتری</th><th>خدمت</th><th>متخصص</th><th>وضعیت</th></tr></thead><tbody><tr><td>۰۹:۳۰</td><td>مریم رضایی</td><td>کوتاهی و استایل</td><td>مهسا کریمی</td><td><span class="status">تأیید شده</span></td></tr><tr><td>۱۱:۰۰</td><td>سارا احمدی</td><td>رنگ و مش</td><td>نگار احمدی</td><td><span class="status">تأیید شده</span></td></tr><tr><td>۱۲:۳۰</td><td>الناز محمدی</td><td>کاشت ناخن</td><td>سمیرا نوروزی</td><td><span class="status warn">جدید</span></td></tr><tr><td>۱۴:۰۰</td><td>نگین مرادی</td><td>کراتینه</td><td>نگار احمدی</td><td><span class="status">تأیید شده</span></td></tr></tbody></table></section><section class="panel"><div class="panelHead"><h3>وضعیت متخصص‌ها</h3><span class="mini">امروز</span></div><div style="padding:12px 16px"><div class="profileRow" style="padding:10px 0;border-bottom:1px solid #f0f2f5"><div class="person">س</div><div><b style="font-size:12px">سمیرا نوروزی</b><div class="mini">خدمات ناخن</div></div><span class="status" style="margin-right:auto">در دسترس</span></div><div class="profileRow" style="padding:10px 0;border-bottom:1px solid #f0f2f5"><div class="person">ن</div><div><b style="font-size:12px">نگار احمدی</b><div class="mini">رنگ و احیا</div></div><span class="status" style="margin-right:auto">در حال کار</span></div><div class="profileRow" style="padding:10px 0"><div class="person">م</div><div><b style="font-size:12px">مهسا کریمی</b><div class="mini">کوتاهی</div></div><span class="status" style="margin-right:auto">در دسترس</span></div></div></section></div></main></div></div>`}
function openAuth(){document.getElementById('overlay').innerHTML=`<div class="modal"><div class="modalHead"><h2>ورود به پنل سالن</h2><button class="iconbtn" onclick="closeModal()">${icon('close')}</button></div><div class="modalBody"><div class="notice">برای نسخه نمایشی، با اطلاعات نمونه وارد شوید. در محصول واقعی، نام کاربری و رمز از طرف پلتفرم صادر می‌شود.</div><div class="form" style="margin-top:16px"><div class="field"><label>نام کاربری</label><input id="u" value="samira.salon"/></div><div class="field"><label>رمز عبور</label><input id="p" type="password" value="demo1405"/></div></div><div class="modalFoot"><button class="btn ghost" onclick="closeModal()">انصراف</button><button class="btn primary" onclick="login()">ورود به پنل ${icon('arrow')}</button></div></div></div>`;document.getElementById('overlay').classList.remove('hidden')}
function login(){closeModal();state.screen='dashboard';render();toast('خوش آمدید؛ دوره آزمایشی ۱۴ روزه فعال است.')}
function openBooking(){state.bookingStep=1;state.service=null;state.pro=null;state.time=null;drawBooking()}
function drawBooking(){let body='';if(state.bookingStep===1)body=`<div class="mini" style="margin-bottom:7px">سالن انتخاب‌شده</div><h3 style="margin:0 0 16px">سالن زیبایی سمیرا</h3><div class="mini" style="margin-bottom:9px">چه خدمتی می‌خواهید؟</div><div class="choiceGrid">${services.map((s,i)=>`<button class="choice ${state.service===i?'selected':''}" onclick="pickService(${i})"><div class="title">${s[0]}</div><div class="desc">${s[1]} · ${s[2]}</div></button>`).join('')}</div>`;if(state.bookingStep===2)body=`<div class="mini" style="margin-bottom:7px">خدمت: ${services[state.service][0]}</div><h3 style="margin:0 0 16px">متخصص موردنظر را انتخاب کنید</h3><div class="people">${pros.map((p,i)=>`<button class="choice ${state.pro===i?'selected':''}" onclick="pickPro(${i)}"><div class="personCard"><div class="personImg">${p[0][0]}</div><div><div class="title">${p[0]}</div><div class="desc">${p[1]}</div></div></div></button>`).join('')}</div>`;if(state.bookingStep===3)body=`<div class="mini">${services[state.service][0]} · ${pros[state.pro][0]}</div><h3 style="margin:0 0 16px">زمان مناسب را انتخاب کنید</h3><div class="notice" style="margin-bottom:14px">سیستم زمان‌های آزاد واقعی متخصص را بررسی کرده و فقط گزینه‌های قابل رزرو را نمایش می‌دهد.</div><div class="times">${times.map((t,i)=>`<button class="time ${state.time===i?'selected':''}" onclick="pickTime(${i})">${t}</button>`).join('')}</div>`;if(state.bookingStep===4)body=`<h3 style="margin:0 0 16px">ثبت نهایی نوبت</h3><div class="notice" style="margin-bottom:16px">${services[state.service][0]} · ${pros[state.pro][0]} · ساعت ${times[state.time]} · امروز</div><div class="form"><div class="field"><label>نام و نام خانوادگی</label><input placeholder="مثلاً سارا احمدی"/></div><div class="field"><label>شماره موبایل</label><input inputmode="tel" placeholder="09xxxxxxxxx"/></div></div><div class="notice" style="margin-top:12px">برای ثبت نهایی، ورود/ساخت حساب مشتری با شماره موبایل و OTP الزامی است.</div>`;document.getElementById('overlay').innerHTML=`<div class="modal"><div class="modalHead"><h2>رزرو آنلاین · سالن زیبایی سمیرا</h2><button class="iconbtn" onclick="closeModal()">${icon('close')}</button></div><div class="modalBody"><div class="steps">${[1,2,3,4].map(i=>`<span class="step ${i<=state.bookingStep?'on':''}"></span>`).join('')}</div>${body}<div class="modalFoot"><button class="btn ghost" onclick="${state.bookingStep>1?'prevBook()':'closeModal()'}">${state.bookingStep>1?'مرحله قبل':'انصراف'}</button>${state.bookingStep<4?`<button class="btn primary" onclick="nextBook()" ${((state.bookingStep===1&&state.service===null)||(state.bookingStep===2&&state.pro===null)||(state.bookingStep===3&&state.time===null))?'disabled':''}>ادامه ${icon('arrow')}</button>`:`<button class="btn primary" onclick="finishBooking()">ورود با OTP و ثبت نوبت</button>`}</div></div></div>`;document.getElementById('overlay').classList.remove('hidden')}
function pickService(i){state.service=i;drawBooking()}function pickPro(i){state.pro=i;drawBooking()}function pickTime(i){state.time=i;drawBooking()}function nextBook(){if(state.bookingStep<4)state.bookingStep++;drawBooking()}function prevBook(){if(state.bookingStep>1)state.bookingStep--;drawBooking()}function finishBooking(){document.getElementById('overlay').innerHTML=`<div class="modal"><div class="success"><div class="successMark">${icon('check')}</div><h2>نوبت شما موقتاً رزرو شد</h2><p style="color:var(--muted);font-size:13px">برای نهایی‌سازی، کد OTP به شماره موبایل شما ارسال می‌شود. پس از تأیید، نوبت در پنل سالن ثبت و برای متخصص اعلان می‌شود.</p><div class="notice">کد پیگیری: <b>NB-${Math.floor(100000+Math.random()*900000)}</b></div><button class="btn primary" style="margin-top:16px" onclick="closeModal()">متوجه شدم</button></div></div>`;toast('اعلان رزرو برای سالن ارسال می‌شود.')}
function closeModal(){document.getElementById('overlay').classList.add('hidden')}function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2600)}
render();
</script></body></html>
